<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Verify Medical Certificate</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #eef1f4; color: #1e2733;
         min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 20px 14px; }
  .card { background: #fff; width: 100%; max-width: 440px; border-radius: 16px; box-shadow: 0 2px 14px rgba(0,0,0,.1); overflow: hidden; }
  .banner { padding: 26px 20px; text-align: center; color: #fff; }
  .banner .icon { font-size: 46px; line-height: 1; }
  .banner h1 { margin: 8px 0 2px; font-size: 24px; letter-spacing: .5px; }
  .banner p { margin: 0; font-size: 14px; opacity: .95; }
  .ok { background: #1f7a4d; } .bad { background: #b3261e; } .wait { background: #536074; }
  .body { padding: 18px 22px 22px; }
  .row { padding: 10px 0; border-bottom: 1px solid #edf0f3; }
  .row:last-of-type { border-bottom: none; }
  .label { font-size: 12px; color: #6b7684; text-transform: uppercase; letter-spacing: .6px; }
  .value { font-size: 17px; font-weight: 600; margin-top: 2px; word-wrap: break-word; }
  .note { font-size: 12px; color: #6b7684; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div id="banner" class="banner wait"><div class="icon">…</div><h1>Checking</h1><p>Please wait</p></div>
    <div id="body" class="body"></div>
  </div>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script>
    (function () {
      const banner = document.getElementById('banner');
      const body = document.getElementById('body');
      const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      function show(kind, icon, title, sub, html) {
        banner.className = 'banner ' + kind;
        banner.innerHTML = '<div class="icon">' + icon + '</div><h1>' + title + '</h1><p>' + sub + '</p>';
        body.innerHTML = html || '';
      }
      const row = (label, value) => value ? '<div class="row"><div class="label">' + label + '</div><div class="value">' + esc(value) + '</div></div>' : '';

      async function run() {
        const token = new URLSearchParams(location.search).get('t');
        const cfg = window.MEDCERT_CONFIG || {};
        if (!token) return show('bad', '✕', 'NOT VERIFIED', 'No certificate code in this link.', '<p class="note">Scan the QR code printed on the certificate.</p>');
        if (!cfg.SUPABASE_URL || /YOUR-PROJECT-ID/.test(cfg.SUPABASE_URL)) return show('wait', '!', 'Not set up', 'The verification service is not configured yet.');

        const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
        const { data, error } = await sb.rpc('verify_certificate', { p_token: token });
        if (error) return show('wait', '!', 'Cannot check right now', 'Please check your internet connection and try again.');

        if (!data || !data.found) {
          return show('bad', '✕', 'NOT FOUND', 'This certificate is not in our records.',
            '<p class="note">Do not accept this certificate as genuine. Contact the issuing health center to confirm.</p>');
        }
        const issued = [data.issued_month, data.issued_day ? data.issued_day + ',' : '', data.issued_year].filter(Boolean).join(' ');
        const details =
          row('Certificate No.', data.control_number) +
          row('Patient', data.patient_name) +
          row('Date examined', data.date_examined) +
          row('Date issued', issued) +
          row('Physician', [data.physician, data.physician_title].filter(Boolean).join(' — ')) +
          row('License No.', data.license) +
          row('Issued by', [data.issuer, data.office].filter(Boolean).join(' — '));
        const note = '<p class="note">Compare these details with the printed certificate. Medical information (diagnosis, remarks, address) is never shown on this page.</p>';

        if (data.status === 'cancelled') {
          return show('bad', '✕', 'CANCELLED', 'This certificate was cancelled by the issuer.', details + note);
        }
        show('ok', '✓', 'GENUINE', 'This certificate is in our records.', details + note);
      }
      run().catch(() => show('wait', '!', 'Cannot check right now', 'Something went wrong. Please try again.'));
    })();
  </script>
</body>
</html>
